name: Unity CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run EditMode and PlayMode tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Explain how to enable CI tests
        if: ${{ env.UNITY_LICENSE == '' }}
        run: |
          echo "UNITY_LICENSE secret is not configured."
          echo "Add UNITY_LICENSE in repository secrets to run Unity tests in CI."

      - name: Cache Unity Library
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run tests
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: game-ci/unity-test-runner@v4
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: all
          unityVersion: 6000.3.24f1
